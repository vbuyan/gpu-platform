# Argo CD manages its own upgrades: bump targetRevision here, commit, and it upgrades itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.0
      helm:
        releaseName: argocd
        valueFiles: [$values/bootstrap/argocd-values.yaml]
    - repoURL: https://github.com/vbuyan/gpu-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: false, selfHeal: true}   # never auto-delete the tool that does the deleting
