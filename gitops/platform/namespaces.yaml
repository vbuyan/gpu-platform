# Workload namespaces with budgets. They sit inside the node memory cap next to system pods and Argo CD.
# Every container gets default requests/limits, so nothing runs unbounded.
apiVersion: v1
kind: Namespace
metadata:
  name: jobs
  labels:
    gpu-platform/purpose: batch
    # no root, no capabilities, no host paths: the GPU comes only through CDI and the queue
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: budget, namespace: jobs}
spec:
  hard: {requests.memory: 2Gi, limits.memory: 4Gi, requests.cpu: "2", pods: "10"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: jobs}
spec:
  limits:
    - type: Container
      default: {memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 3Gi}   # Whisper large-v3-turbo loads ~1.6 GiB of weights through RAM
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    gpu-platform/purpose: observability
    # node-exporter needs the host network, PID namespace and read-only host paths
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: budget, namespace: monitoring}
spec:
  hard: {requests.memory: 1536Mi, limits.memory: 4Gi, pods: "15"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: monitoring}
spec:
  limits:
    - type: Container
      default: {memory: 256Mi}
      defaultRequest: {cpu: 25m, memory: 64Mi}
