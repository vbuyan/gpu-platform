# Workload namespaces with budgets. The node cap is ~6.5 GiB; system pods and Argo CD take ~1.5 GiB.
# Every container gets default requests/limits, so nothing runs unbounded.
apiVersion: v1
kind: Namespace
metadata:
  name: jobs
  labels: {gpu-platform/purpose: batch}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: budget, namespace: jobs}
spec:
  hard: {requests.memory: 2Gi, limits.memory: 3Gi, requests.cpu: "2", pods: "10"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: jobs}
spec:
  limits:
    - type: Container
      default: {memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 2Gi}
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels: {gpu-platform/purpose: observability}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: budget, namespace: monitoring}
spec:
  hard: {requests.memory: 1Gi, limits.memory: 2Gi, pods: "15"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: monitoring}
spec:
  limits:
    - type: Container
      default: {memory: 256Mi}
      defaultRequest: {cpu: 25m, memory: 64Mi}
