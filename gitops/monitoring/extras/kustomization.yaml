apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rules.yaml
  - dashboard.yaml
configMapGenerator:
  - name: gpu-queue-exporter
    files: [gpu_queue_exporter.py]
    options:
      disableNameSuffixHash: true   # node-exporter mounts it by this exact name
