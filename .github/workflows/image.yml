name: image
on:
  push:
    branches: [main]
    paths:
      - gitops/monitoring/extras/gpu_queue_exporter.py
      - images/**
      - .github/workflows/image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gpu-queue-exporter
            severity: CRITICAL,HIGH       # small image, no excuses
          - name: subtitles
            severity: CRITICAL            # CUDA + PyTorch base: block on critical, report the rest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: free disk for the CUDA base image
        if: matrix.name == 'subtitles'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.name }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: scan (fail on fixable ${{ matrix.severity }} CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned by commit
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: ${{ matrix.severity }}
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.name }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
